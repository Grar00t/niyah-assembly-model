name: Verify native source pair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: niyah-assembly-model
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Grar00t/niyah-lang
          ref: 545498ea74320abaac0d64ff1ba8d741af64702b
          path: niyah-lang
          persist-credentials: false
      - name: Build reference allocator
        run: make -C niyah-assembly-model tile-allocator
      - name: Run local verification gates
        run: make -C niyah-assembly-model nexus-native verify-nexus NIYAH_LANG=../niyah-lang
