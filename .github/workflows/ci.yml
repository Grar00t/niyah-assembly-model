name: assembly-model
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Generation tests
        run: make test
      - name: Train and save checkpoint
        run: make checkpoint
      - name: Verify identity and replay
        run: make verify test-checkpoint
