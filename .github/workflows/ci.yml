name: assembly-model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build native Assembly binaries (portable and CPUID-dispatched)
        run: make
      - name: Exact rational Assembly differential and failure tests
        run: make test-exactcalc
      - name: Offline native-Assembly heldout evaluator regression
        run: make test-tinystories-eval
      - name: Offline hybrid native probability and independent trigram oracle
        run: make test-hybrid-eval
      - name: Trigram generation tests
        run: make test
      - name: Assembly attention and independent math oracle
        run: make test-attention
      - name: Independent QKV finite-difference gradient checks
        run: make test-qkv-gradients
      - name: AVX2 FMA versus scalar differential verification
        run: make test-simd
      - name: Trigram checkpoint train, identity and replay
        run: make checkpoint verify test-checkpoint
      - name: Neural attention checkpoint, identity, replay and corruption rejection
        run: make attention-checkpoint verify-attention test-attention-checkpoint test-attention-negative
      - name: Inference checkpoint TOCTOU regression
        run: make test-attention-snapshot
      - name: Pure assembly auto-kernel inference from verified weights
        run: make generate-attention-auto
      - name: Upload bounded verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly-model-verification
          path: |
            verification_results.json
            attention_verification.json
          if-no-files-found: ignore
